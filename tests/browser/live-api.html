<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>بررسی خواندن GeoBox</title>
<body><h1>بررسی صفحه‌بندی GeoBox</h1><button id="run">اجرای بررسی فقط خواندنی</button><pre id="result">آماده</pre>
<script type="module">
import { fetchVectorLayers, fetchLayerFeatures, fetchAllFeatures } from '/src/composables/useGeoboxApi.js'
const result = document.querySelector('#result')
const features = data => Array.isArray(data) ? data : data.features ?? data.results ?? data.data ?? []
const key = f => String(f.id ?? f.fid ?? f.properties?.id ?? f.properties?.OBJECTID ?? JSON.stringify(f))
const same = (a,b) => a.length === b.length && a.every((v,i) => key(v) === key(b[i]))
document.querySelector('#run').onclick = async event => {
  event.target.disabled = true
  result.textContent = 'در حال بررسی…'
  const checks = []
  try {
    const layers = await fetchVectorLayers()
    const paged = await fetchVectorLayers({pageSize: 2})
    checks.push({test:'layers: default vs page size 2',total:layers.length,unique:new Set(paged.map(l=>l.uuid)).size,pass:layers.length===paged.length && layers.every((l,i)=>l.uuid===paged[i].uuid)})
    for (const layer of layers.filter(l=>/^(wells_wells|rings|Lishter_Valve)$/.test(l.name))) {
      const all = await fetchAllFeatures(layer.uuid)
      const first = features(await fetchLayerFeatures(layer.uuid,{skip:0,limit:3,page:1,pageSize:3}))
      const second = features(await fetchLayerFeatures(layer.uuid,{skip:3,limit:3,page:2,pageSize:3}))
      const tail = features(await fetchLayerFeatures(layer.uuid,{skip:all.length,limit:3,page:Math.floor(all.length/3)+1,pageSize:3}))
      const secondLarge = all.length > 2000 ? features(await fetchLayerFeatures(layer.uuid,{skip:2000,limit:2000,page:2,pageSize:2000})) : []
      checks.push({test:layer.name,expected:layer.feature_count,total:all.length,unique:new Set(all.map(key)).size,firstPage:first.length,secondPage:second.length,secondLarge:secondLarge.length,tail:tail.length,pass:Number(layer.feature_count)===all.length&&same(all.slice(0,3),first)&&same(all.slice(3,6),second)&&tail.length===0&&new Set(all.map(key)).size===all.length&&(all.length<=2000||same(all.slice(2000),secondLarge))})
      result.textContent=JSON.stringify(checks,null,2)
    }
    result.textContent=JSON.stringify(checks,null,2)
  } catch(error) { result.textContent=JSON.stringify({checks,error:error.message},null,2) }
  finally { event.target.disabled=false }
}
</script></body></html>
